<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<link rel="stylesheet" href="vendor/reveal/reveal.css">
<link rel="stylesheet" href="vendor/reveal/theme/white.css" id="theme">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="resultats.css">
</head>
<body>
<div class="reveal"><div class="slides" id="slides"></div></div>

<script src="vendor/reveal/reveal.js"></script>
<script src="vendor/reveal/plugin/notes/notes.js"></script>
<script src="vendor/lottie/lottie.min.js"></script>
<script src="sync.js"></script>
<script src="camera.js"></script>
<script src="quiz-deck.js"></script>
<script src="teachable.js"></script>
<script src="resultats-statiques.js"></script>
<script>
(async () => {
  const role = AmphiSync.role;
  document.documentElement.dataset.role = role;
  const slides = document.getElementById('slides');
  // ?prez=slug : prévisualisation d'une présentation non active (pas de synchronisation) ; sinon la présentation active.
  const params = new URLSearchParams(location.search);
  const prez = /^[a-z0-9-]{1,40}$/.test(params.get('prez') || '') ? params.get('prez') : null;
  // ?copie=<AAAA-MM-JJ_HHMMSS> : la présentation telle qu'elle était pendant une séance (copie figée, docs/seance.md §F).
  const copie = prez && /^\d{4}-\d{2}-\d{2}_\d{6}$/.test(params.get('copie') || '') ? params.get('copie') : null;
  const base = prez ? '/p/' + prez + '/' + (copie ? 'seances/' + copie + '/' : '') : '';

  // Métadonnées de la présentation (titre, thème, camera) : /api/presentations/active ou l'entrée de la présentation demandée.
  let meta = {};
  async function metadonnees() {
    try {
      if (!prez) return await (await fetch('/api/presentations/active', { cache: 'no-store' })).json();
      const liste = await (await fetch('/api/presentations', { cache: 'no-store' })).json();
      return liste.find(p => p.slug === prez) || {};
    } catch (e) { return {}; }
  }
  // Feuille de thème optionnelle (deck/themes/<theme>.css), après theme.css ; remplacée à chaque changement de présentation.
  async function appliquerTheme(meta) {
    if (meta.titre) document.title = meta.titre;
    const ancien = document.getElementById('theme-prez');
    const theme = meta.theme && /^[a-z0-9_-]{1,40}$/.test(meta.theme) ? meta.theme : null;
    if (ancien && ancien.dataset.theme === (theme || '')) return;
    if (ancien) ancien.remove();
    if (!theme) return;
    const lien = document.createElement('link');
    lien.id = 'theme-prez'; lien.dataset.theme = theme;
    lien.rel = 'stylesheet'; lien.href = 'themes/' + theme + '.css';
    document.head.appendChild(lien);
    await new Promise(r => { lien.onload = lien.onerror = r; });
  }
  /** En prévisualisation, les médias relatifs (medias/…) sont ceux de la présentation demandée, pas de l'active. */
  function reecrireMedias(racine) {
    if (!prez) return;
    const prefixe = base;
    racine.querySelectorAll('[src^="medias/"], [data-src^="medias/"], [data-background-image^="medias/"]').forEach(el => {
      for (const attr of ['src', 'data-src', 'data-background-image']) {
        const v = el.getAttribute(attr);
        if (v && v.startsWith('medias/')) el.setAttribute(attr, prefixe + v);
      }
    });
  }

  async function charger() {
    meta = await metadonnees();
    await appliquerTheme(meta);
    // Le contenu du deck vit dans slides.html (PowerPoint converti, PDF converti ou éditeur).
    const html = await (await fetch(prez ? base + 'slides.html' : 'slides.html', { cache: 'no-store' })).text();
    slides.innerHTML = html;
    reecrireMedias(slides);
    // Rôles obs, séance, impression : aucune transition (rendu simultané, sauts de la relecture, pages du PDF).
    if (['obs', 'seance', 'impression'].includes(role)) slides.querySelectorAll('[data-transition]').forEach(s => s.removeAttribute('data-transition'));
    await AmphiQuizDeck.preparer(slides, prez, meta.camera, copie ? base + 'quiz.json' : undefined);
    AmphiTeachable.preparer(slides);
    // Rôle obs : zone réservée à la vignette caméra (docs/zone-camera.md), ajustée en mémoire, jamais réécrite dans le fichier.
    if (role === 'obs') reserverCamera();
  }
  /** Secours au rendu OBS : les .el des sections libres qui chevauchent la zone caméra sont réagencés (deck/camera.js). */
  function reserverCamera() {
    const zone = AmphiCamera.zoneCamera(meta.camera); // undefined (API indisponible) → défaut ; null → désactivée
    if (!zone) return;
    slides.querySelectorAll('section.libre').forEach(s => {
      AmphiCamera.reagencer(s, zone).forEach(a => console.info('zone caméra : ' + (s.dataset.id || '?') + ' · ' + a.id + ' (' + a.type + ') : ' + a.action));
    });
  }
  await charger();

  const commun = {
    width: 1920, height: 1080, margin: 0.04,
    hash: false, history: false, center: true,
    slideNumber: role === 'scene' ? 'c/t' : false,
    plugins: [RevealNotes],
    preloadIframes: true, autoPlayMedia: false,
  };
  const parRole = {
    // PC 1 : plein écran, contrôles masqués, clavier actif en secours.
    scene:  { controls: false, progress: false, keyboard: true,  touch: false, transition: 'fade', transitionSpeed: 'fast' },
    // PC 2 : rien ne doit bouger ni répondre à un clavier ; fondu 0 ms pour un rendu simultané.
    obs:    { controls: false, progress: false, keyboard: false, touch: false, transition: 'none', backgroundTransition: 'none' },
    // Téléphone : miniature embarquée dans remote.html, pilotée par ses boutons.
    remote: { controls: false, progress: false, keyboard: false, touch: false, embedded: true, transition: 'none' },
    // Page séance : la page parente pilote la position (postMessage) au rythme du journal.
    seance: { controls: false, progress: false, keyboard: false, touch: false, transition: 'none', backgroundTransition: 'none' },
    // Export PDF : une page par diapositive jouée, résultats des questions, puis impression.
    impression: { controls: false, progress: false, keyboard: false, touch: false, transition: 'none', view: 'print', pdfSeparateFragments: false },
  };
  if (role === 'impression') await preparerImpression();
  await Reveal.initialize({ ...commun, ...parRole[role] });

  Reveal.on('slidechanged', e => {
    if (e.previousSlide) { AmphiQuizDeck.horsDiapositive(e.previousSlide); AmphiTeachable.horsDiapositive(e.previousSlide); }
    AmphiQuizDeck.surDiapositive(e.currentSlide); AmphiTeachable.surDiapositive(e.currentSlide);
  });
  Reveal.on('fragmentshown', e => AmphiQuizDeck.surFragment(e.fragment));
  Reveal.on('ready', e => { AmphiQuizDeck.surDiapositive(e.currentSlide); AmphiTeachable.surDiapositive(e.currentSlide); });

  // L'éditeur a enregistré ou une autre présentation a été activée : recharger le contenu sans perdre la position
  // (tous les rôles, la miniature de la télécommande comprise ; à l'activation, on revient à la première diapositive).
  AmphiSync.on('recharger', async m => {
    const i = Reveal.getIndices();
    await charger(); // relit aussi les métadonnées (thème, caméra) et rejoue l'ajustement OBS
    Reveal.sync();
    AmphiTeachable.surDiapositive(Reveal.getCurrentSlide());
    if (m && m.prez) Reveal.slide(0, 0, -1);
    else Reveal.slide(i.h, i.v, i.f);
  });
  // Prévisualisation d'une présentation non active : pas de synchronisation avec la salle.
  if (!prez) { AmphiQuizDeck.demarrerQR(); AmphiSync.demarrer(); }

  // ---- Page séance (deck/seance.html) : position et résultats envoyés par la page parente ----
  if (role === 'seance') {
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
      const m = e.data;
      if (m.type === 'aller') {
        const i = Reveal.getIndices();
        if (i.h !== m.h || (i.v || 0) !== (m.v || 0) || (i.f ?? -1) !== (m.f ?? -1)) Reveal.slide(m.h, m.v || 0, m.f ?? -1);
      } else if (m.type === 'resultats' && m.resultats) remplirResultats(slides, m.resultats);
    });
    window.parent.postMessage({ type: 'deck-pret', total: Reveal.getTotalSlides() }, location.origin);
  }

  /** Place les résultats d'une question dans l'emplacement « salle » des diapositives de quiz (deck/resultats-statiques.js). */
  function remplirResultats(racine, resultats) {
    // Diapositive de quiz générée (emplacement « question ») ou dessinée (élément data-amphi="resultats" data-question="…").
    racine.querySelectorAll('[data-replay-salle="question"], [data-replay-salle="resultats"]').forEach(zone => {
      const porteur = zone.closest('[data-question]') || zone.closest('section[data-quiz]');
      const qid = porteur && (porteur.dataset.question || porteur.dataset.quiz);
      const r = qid && resultats[qid];
      if (r && window.AmphiResultats) { zone.innerHTML = AmphiResultats.rendre(r.question, r.resultat); zone.classList.add('remplie'); }
    });
  }

  /** Export PDF : garde les diapositives jouées pendant la séance, ajoute heure, durée et résultats, puis imprime. */
  async function preparerImpression() {
    const id = params.get('historique'), jeton = params.get('token') || '';
    let detail = null;
    try {
      const r = await fetch('/api/presentations/' + prez + '/historique/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(jeton), { cache: 'no-store' });
      if (r.ok) detail = await r.json();
    } catch (e) { /* imprimé sans les résultats */ }
    const sections = [...slides.children].filter(s => s.tagName === 'SECTION');
    if (detail) {
      // Temps passé sur chaque diapositive (somme des passages), heure de la première arrivée.
      const diapos = detail.evenements.filter(e => e.type === 'diapositive');
      const passages = {};
      diapos.forEach((e, k) => {
        const suivant = diapos[k + 1] ? diapos[k + 1].horodatage : detail.fin;
        const p = passages[e.h] || (passages[e.h] = { arrivee: e.horodatage, duree: 0 });
        p.duree += Math.max(0, suivant - e.horodatage);
      });
      if (params.get('toutes') !== '1') sections.forEach((s, h) => { if (!passages[h]) s.remove(); });
      const date = t => new Date(t * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const duree = s => s >= 60 ? Math.floor(s / 60) + ' min ' + String(Math.round(s % 60)).padStart(2, '0') : Math.round(s) + ' s';
      sections.forEach((s, h) => {
        if (!s.isConnected) return;
        const p = passages[h];
        s.insertAdjacentHTML('beforeend', '<div class="impression-pied">' + (h + 1) + ' / ' + sections.length + (p ? ' · affichée à ' + date(p.arrivee) + ' · ' + duree(p.duree) : ' · non affichée') + '</div>');
      });
      remplirResultats(slides, detail.resultats || {});
      document.title = (detail.titre || 'Séance') + ' – ' + new Date(detail.debut * 1000).toLocaleDateString('fr-FR');
    }
    Reveal.on('pdf-ready', () => setTimeout(() => window.print(), 600));
  }
})();
</script>
</body>
</html>
