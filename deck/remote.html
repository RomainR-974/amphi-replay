<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111">
<title>Télécommande</title>
<style>
  /* Un seul écran, en portrait, sans menu. Chaque action critique d'un seul geste. */
  :root { --fond: #111; --texte: #eee; --sourd: #888; --vert: #22c55e; --rouge: #ef4444; --bleu: #3b82f6; --orange: #f59e0b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font-family: system-ui, sans-serif; overscroll-behavior: none; }
  body { display: grid; grid-template-rows: auto auto 1fr auto auto; grid-template-columns: minmax(0, 1fr); height: 100dvh; } /* minmax(0, …) : un long titre ne doit pas élargir la page */

  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  #titre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sourd); text-align: center; }
  .voyants { display: flex; gap: 10px; }
  .voyant { display: flex; align-items: center; gap: 5px; }
  .voyant::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--rouge); }
  .voyant.ok::before { background: var(--vert); }
  .voyant.vieux::before { background: var(--orange); }
  #chrono { font-size: 18px; font-weight: 600; }

  .miniature { position: relative; margin: 0 12px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  .miniature iframe { width: 1920px; height: 1080px; border: 0; transform-origin: top left; pointer-events: none; }
  .numero { position: absolute; right: 8px; bottom: 6px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 6px; font-size: 14px; }

  .milieu { margin: 10px 12px 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .notes { flex: 1; padding: 12px; overflow-y: auto; font-size: 20px; line-height: 1.45; background: #1b1b1b; border-radius: 8px; min-height: 0; }

  /* Retour caméra + vumètre (première diapositive, docs/seance.md §G) */
  .apercu { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .apercu[hidden] { display: none; }
  .cadre-cam { position: relative; aspect-ratio: 16 / 9; max-height: 34dvh; margin: 0 auto; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
  .cadre-cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cadre-cam .axe { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: rgba(239, 68, 68, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
  .cadre-cam .axe::after { content: ''; position: absolute; left: -9px; top: 33%; width: 20px; height: 2px; background: rgba(239, 68, 68, .85); }
  .apercu-etat { position: absolute; left: 8px; top: 6px; font-size: 13px; background: rgba(0, 0, 0, .6); padding: 2px 8px; border-radius: 6px; color: var(--sourd); }
  .micro { display: grid; grid-template-columns: auto 1fr 64px; gap: 8px; align-items: center; font-size: 14px; }
  .vu { position: relative; height: 16px; background: #222; border-radius: 8px; overflow: hidden; }
  .vu-barre { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--vert); transition: width .08s linear; }
  .vu-barre.faible { background: #555; } .vu-barre.fort { background: var(--orange); } .vu-barre.sature { background: var(--rouge); }
  .vu-crete { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; left: 0; }
  .vu-zone { position: absolute; top: 0; bottom: 0; left: 33.3%; width: 46.7%; border-left: 1px dashed rgba(255, 255, 255, .25); border-right: 1px dashed rgba(255, 255, 255, .25); } /* -40 à -12 dB : zone conseillée */
  .vu-texte { text-align: right; font-variant-numeric: tabular-nums; color: var(--sourd); }
  .vu-texte.alerte { color: var(--orange); font-weight: 700; }
  .notes p { margin: 0 0 .6em; }
  .notes:empty::before { content: 'Pas de notes pour cette diapositive.'; color: var(--sourd); }

  .quiz { margin: 10px 12px 0; padding: 10px 12px; background: #1b1b1b; border-radius: 8px; display: none; gap: 8px; grid-template-columns: 1fr 1fr 1fr auto; align-items: center; }
  .quiz.visible { display: grid; }
  .quiz .titre { grid-column: 1 / -1; font-size: 14px; color: var(--sourd); display: flex; justify-content: space-between; }
  .quiz .compteur { font-size: 28px; font-weight: 700; text-align: center; min-width: 56px; }
  .quiz .compteur small { display: block; font-size: 12px; font-weight: 400; color: var(--orange); }
  .quiz button { min-height: 56px; font-size: 17px; font-weight: 600; border: 0; border-radius: 10px; color: #fff; }
  .quiz .ouvrir { background: var(--vert); } .quiz .fermer { background: var(--rouge); } .quiz .reveler { background: var(--bleu); }
  .quiz .reinit { grid-column: 1 / -1; background: #333; color: var(--sourd); min-height: 40px; font-size: 14px; }
  .quiz button:disabled { opacity: .35; }

  nav { display: grid; grid-template-columns: 1fr .72fr 1.6fr; gap: 10px; padding: 12px; }
  nav button { min-height: 88px; font-size: 24px; font-weight: 700; border: 0; border-radius: 14px; color: #fff; background: #2a2a2a; }
  nav .suivant { background: var(--bleu); }
  nav .suivant.quitter { background: var(--rouge); }
  nav .qr-bouton { position: relative; font-size: 20px; background: #3a2d05; color: var(--orange); }
  nav .qr-bouton small { display: block; font-size: 12px; font-weight: 500; color: #c9a23a; margin-top: 2px; }
  nav .qr-bouton .nb { position: absolute; top: 8px; right: 8px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--orange); color: #111; font-size: 14px; font-weight: 800; display: none; align-items: center; justify-content: center; }
  nav .qr-bouton .nb.visible { display: inline-flex; }
  nav .qr-bouton.en-cours { background: #0b3a1c; color: var(--vert); }
  nav button:active { filter: brightness(1.3); }

  /* Badge « ? n » : questions des participants en attente (docs/questions.md) */
  .badge-q { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 12px; background: #2a2a2a; color: var(--sourd); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .badge-q.actif { background: var(--orange); color: #111; }

  /* Mode questions-réponses : plein écran dans la télécommande */
  .qr { display: none; position: fixed; inset: 0; z-index: 30; background: var(--fond); flex-direction: column; }
  .qr.visible { display: flex; }
  .qr-tete { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #222; }
  .qr-tete h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; }
  .qr-tete button { min-height: 42px; padding: 0 14px; border: 0; border-radius: 10px; font-weight: 600; font-size: 15px; color: #fff; background: #2a2a2a; }
  .qr-tete .terminer { background: var(--rouge); }
  .qr-corps { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .rappel { background: #1b1b1b; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .rappel .obs { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; }
  .rappel .obs::before { content: '⏺'; color: var(--rouge); font-size: 22px; line-height: 1; }
  .rappel .obs small { display: block; color: var(--sourd); margin-top: 4px; font-size: 13px; }
  .rappel .commencer { min-height: 64px; font-size: 20px; font-weight: 700; border: 0; border-radius: 12px; background: var(--vert); color: #fff; }
  .tri { display: flex; gap: 8px; align-items: center; }
  .tri span { color: var(--sourd); font-size: 13px; }
  .tri button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: #2a2a2a; color: var(--sourd); font-weight: 600; font-size: 14px; }
  .tri button.actif { background: #333; color: var(--texte); }
  .liste-q { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .liste-q li { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; background: #1b1b1b; border-radius: 12px; padding: 10px 12px; }
  .liste-q .corps { min-width: 0; cursor: pointer; }
  .liste-q .diapo { font-size: 13px; color: var(--bleu); font-weight: 700; display: flex; gap: 6px; min-width: 0; }
  .liste-q .diapo small { color: var(--sourd); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste-q .texte { font-size: 17px; line-height: 1.35; margin: 4px 0; overflow-wrap: anywhere; }
  .liste-q .pseudo { font-size: 13px; color: var(--sourd); }
  .liste-q .actions { display: flex; flex-direction: column; gap: 4px; }
  .liste-q .actions button { width: 42px; height: 36px; border: 0; border-radius: 8px; background: #2a2a2a; color: var(--texte); font-size: 15px; }
  .liste-q .actions button:disabled { opacity: .3; }
  .liste-q .actions .ecarter { color: var(--rouge); }
  .vide-q, .fini-q { text-align: center; padding: 30px 10px; font-size: 18px; color: var(--sourd); line-height: 1.4; }
  .fini-q { color: var(--vert); font-weight: 600; }
  .vue-q { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .vue-q .diapo { color: var(--bleu); font-weight: 700; font-size: 15px; }
  .vue-q .diapo small { color: var(--sourd); font-weight: 400; }
  .vue-q .texte { font-size: 24px; line-height: 1.35; font-weight: 600; flex: 1; overflow: auto; overflow-wrap: anywhere; }
  .vue-q .pseudo { color: var(--sourd); font-size: 14px; }
  .vue-q .deck-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vue-q .deck-nav button { min-height: 52px; border: 0; border-radius: 10px; background: #2a2a2a; color: #fff; font-size: 17px; font-weight: 600; }
  .vue-q .actions-q { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .vue-q .actions-q button { min-height: 76px; border: 0; border-radius: 14px; font-size: 20px; font-weight: 700; color: #fff; background: #2a2a2a; }
  .vue-q .actions-q .suivante { background: var(--bleu); }

  /* Fin de séance (docs/seance.md, C) : écran plein, chronomètre figé */
  .fin { display: none; position: fixed; inset: 0; z-index: 40; background: var(--fond); flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .fin.visible { display: flex; }
  .fin h2 { margin: 0; font-size: 30px; font-weight: 800; }
  .fin p { margin: 0; color: var(--sourd); font-size: 16px; line-height: 1.45; max-width: 420px; }
  .fin .duree { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fin button { min-height: 64px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--bleu); color: #fff; font-size: 20px; font-weight: 700; }

  .barre-erreur { display: none; position: fixed; top: 0; left: 0; right: 0; background: var(--rouge); color: #fff; text-align: center; padding: 6px; font-size: 14px; }
  .barre-erreur.visible { display: block; }
</style>
</head>
<body>
<div class="barre-erreur" id="erreur"></div>

<header>
  <div class="voyants">
    <span class="voyant" id="v-serveur">serveur</span>
    <span class="voyant" id="v-scene">scene</span>
    <span class="voyant" id="v-obs">obs</span>
  </div>
  <div id="titre" title="Présentation active"></div>
  <span class="badge-q" id="badge-q" title="Questions des participants en attente">? 0</span>
  <div id="chrono">00:00</div>
</header>

<div class="miniature" id="miniature">
  <iframe id="deck" title="Deck"></iframe>
  <div class="numero" id="numero">– / –</div>
</div>

<div class="milieu">
  <div class="apercu" id="apercu" hidden>
    <div class="cadre-cam">
      <img id="apercu-img" alt="Retour de la caméra OBS">
      <div class="axe" aria-hidden="true"></div>
      <span class="apercu-etat" id="apercu-etat">connexion à OBS…</span>
    </div>
    <div class="micro" title="Niveau du micro dans OBS">
      <span class="micro-icone">🎙</span>
      <div class="vu"><span class="vu-barre" id="vu-barre"></span><span class="vu-crete" id="vu-crete"></span><span class="vu-zone" aria-hidden="true"></span></div>
      <span class="vu-texte" id="vu-texte">— dB</span>
    </div>
  </div>
  <div class="notes" id="notes"></div>
</div>

<div class="quiz" id="quiz">
  <div class="titre"><span id="quiz-id">quiz</span><span id="quiz-etat">fermé</span></div>
  <button class="ouvrir" id="q-ouvrir">Ouvrir</button>
  <button class="fermer" id="q-fermer" disabled>Fermer</button>
  <button class="reveler" id="q-reveler" disabled>Révéler</button>
  <div class="compteur" id="q-compteur">0</div>
  <button class="reinit" id="q-reinit">Réinitialiser les réponses</button>
</div>

<nav>
  <button id="prec">◀ Précédent</button>
  <button class="qr-bouton" id="b-qr" title="Questions-réponses">Q/R<small>questions</small><span class="nb" id="b-qr-nb"></span></button>
  <button class="suivant" id="suiv">Suivant ▶</button>
</nav>

<div class="fin" id="fin" role="dialog" aria-label="Séance terminée">
  <h2>Séance terminée</h2>
  <div class="duree" id="fin-duree">00:00</div>
  <p>Les participants voient leur rang et le contact. L'enregistrement OBS a reçu l'ordre de s'arrêter.</p>
  <button id="fin-retour">Revenir au début</button>
</div>

<div class="qr" id="qr" role="dialog" aria-label="Questions-réponses">
  <div class="qr-tete">
    <h2>Questions-réponses</h2>
    <span class="badge-q" id="qr-badge">? 0</span>
    <button id="qr-reduire" title="Revenir à la télécommande">✕</button>
    <button class="terminer" id="qr-terminer" hidden>Terminer</button>
  </div>
  <div class="qr-corps" id="qr-corps"></div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const $ = id => document.getElementById(id);
  const deck = $('deck');
  let R = null;               // Reveal de l'iframe
  let questions = {};         // id -> question
  let questionCourante = null; // id de la question de la diapositive affichée
  let etatQuiz = { question: null, ouverte: false, total: 0 };

  if (!token) afficherErreur('Jeton manquant : ouvrir /remote?token=…');

  // --- Titre de la présentation active (rafraîchi quand une autre présentation est activée) ----
  async function afficherTitre() {
    try {
      const m = await (await fetch('/api/presentations/active', { cache: 'no-store' })).json();
      $('titre').textContent = m.titre || '';
    } catch (e) { /* serveur injoignable : on garde le titre précédent */ }
  }
  afficherTitre();

  // --- Miniature : le même deck, rôle remote, mis à l'échelle de la largeur disponible ----
  deck.src = `/deck/?role=remote&token=${encodeURIComponent(token)}`;
  function redimensionner() {
    const l = $('miniature').clientWidth;
    deck.style.transform = `scale(${l / 1920})`;
  }
  new ResizeObserver(redimensionner).observe($('miniature'));
  redimensionner();

  deck.addEventListener('load', () => {
    const w = deck.contentWindow;
    const attendre = setInterval(() => {
      if (w.Reveal && w.Reveal.isReady && w.Reveal.isReady()) {
        clearInterval(attendre);
        R = w.Reveal;
        ['slidechanged', 'fragmentshown', 'fragmenthidden', 'ready'].forEach(ev => R.on(ev, rafraichir));
        if (w.AmphiSync) {
          // À chaque (re)connexion, le titre est relu : l'active a pu changer pendant une coupure réseau.
          w.AmphiSync.on('connexion', ({ connecte }) => { voyant('v-serveur', connecte ? 0 : Infinity); if (connecte) afficherTitre(); });
          w.AmphiSync.on('ack', m => { acks[m.role] = Date.now(); });
          // Présentation activée ou deck enregistré : l'iframe recharge son contenu (index.html) ; ici, titre, notes et quiz.
          w.AmphiSync.on('recharger', () => { afficherTitre(); setTimeout(rafraichir, 500); });
          w.AmphiSync.on('apercu', afficherApercu);
        }
        rafraichir();
      }
    }, 200);
  });

  // --- Navigation : appliquée localement d'abord, la publication suit (AmphiSync dans l'iframe) ----
  // Sur la dernière diapositive (et son dernier fragment), Suivant devient Quitter (docs/seance.md, C).
  let derniere = false;
  function surDerniere() {
    if (!R || !R.isLastSlide()) return false;
    const frags = R.availableFragments ? R.availableFragments() : { next: false };
    return frags.next === false;
  }
  $('suiv').onclick = () => {
    if (!R) return;
    if (derniere) { quitter(); return; }
    R.next();
  };
  $('prec').onclick = () => R && R.prev();
  let x0 = null;
  $('miniature').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  $('miniature').addEventListener('touchend', e => {
    if (x0 === null || !R) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 60) (dx < 0 ? R.next() : R.prev());
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') R && R.next();
    if (e.key === 'ArrowLeft') R && R.prev();
  });

  function rafraichir() {
    if (!R) return;
    const i = R.getIndices();
    $('numero').textContent = `${R.getSlidePastCount() + 1} / ${R.getTotalSlides()}`;
    const diapo = R.getCurrentSlide();
    $('notes').innerHTML = R.getSlideNotes(diapo) || '';
    questionCourante = diapo.dataset.quiz || null;
    $('quiz').classList.toggle('visible', !!questionCourante);
    if (questionCourante) { $('quiz-id').textContent = `quiz ${questionCourante}`; rendreQuiz(); }
    if (!chronoDebut && (i.h > 0 || i.f >= 0)) demarrerChrono();
    basculerApercu(i.h === 0 && (i.v || 0) === 0);
    derniere = surDerniere();
    $('suiv').textContent = derniere ? 'Quitter' : 'Suivant ▶';
    $('suiv').classList.toggle('quitter', derniere);
  }

  // --- Retour caméra + niveau du micro sur la première diapositive (docs/seance.md §G) ----
  // La demande passe par le WebSocket du deck (iframe) ; le pont OBS du PC 2 envoie ≈ 10 images/s tant qu'elle est renouvelée.
  let apercuActif = false, renouvellement = null, derniereImage = 0, creteMax = -60, creteA = 0;
  function demanderApercu(actif) {
    const w = deck.contentWindow;
    if (w && w.AmphiSync && w.AmphiSync.envoyer) w.AmphiSync.envoyer({ type: 'apercu', actif });
  }
  function basculerApercu(actif) {
    if (actif === apercuActif) return;
    apercuActif = actif;
    $('apercu').hidden = !actif;
    clearInterval(renouvellement);
    if (actif) {
      $('apercu-etat').textContent = 'connexion à OBS…';
      demanderApercu(true);
      renouvellement = setInterval(() => {
        demanderApercu(true);
        if (Date.now() - derniereImage > 4000 && derniereImage) $('apercu-etat').textContent = 'image figée : OBS ne répond plus';
      }, 2500);
    } else demanderApercu(false);
  }
  const pourcent = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100)); // -60 dB → 0 %, 0 dB → 100 %
  function afficherApercu(m) {
    if (!apercuActif) return;
    if (m.erreur) { $('apercu-etat').textContent = m.erreur; }
    if (m.image) {
      $('apercu-img').src = m.image;
      derniereImage = Date.now();
      $('apercu-etat').textContent = m.camera ? '📷 ' + m.camera : '';
    }
    if (typeof m.niveau === 'number') {
      const barre = $('vu-barre'), texte = $('vu-texte');
      barre.style.width = pourcent(m.niveau) + '%';
      const crete = typeof m.crete === 'number' ? m.crete : m.niveau;
      if (crete > creteMax || Date.now() - creteA > 1500) { creteMax = crete; creteA = Date.now(); }
      $('vu-crete').style.left = pourcent(creteMax) + '%';
      barre.className = 'vu-barre' + (crete > -3 ? ' sature' : crete > -12 ? ' fort' : m.niveau < -45 ? ' faible' : '');
      const faible = creteMax < -40;
      texte.textContent = faible ? 'trop bas' : crete > -3 ? 'sature' : Math.round(m.niveau) + ' dB';
      texte.classList.toggle('alerte', faible || crete > -3);
    }
  }

  // --- Fin de séance : POST /api/seance/terminer, écran « Séance terminée », chronomètre figé ----
  let seanceTerminee = false;
  async function quitter() {
    if (!confirm('Terminer la séance ?')) return;
    const r = await api('/api/seance/terminer');
    if (r) afficherFin(true);
  }
  function afficherFin(terminee) {
    seanceTerminee = !!terminee;
    $('fin').classList.toggle('visible', seanceTerminee);
    if (seanceTerminee) $('fin-duree').textContent = $('chrono').textContent;
  }
  $('fin-retour').onclick = async () => {
    if (R) R.slide(0, 0, -1);
    const r = await api('/api/seance/reprendre');
    if (r) afficherFin(false);
  };
  // Télécommande rechargée après Quitter : l'écran de fin est réaffiché.
  fetch('/api/seance', { cache: 'no-store' }).then(r => r.json()).then(m => { if (m.terminee) afficherFin(true); }).catch(() => {});

  // --- Quiz : administration par HTTP avec jeton, état par WebSocket ----
  const api = (chemin, corps) => fetch(`${chemin}?token=${encodeURIComponent(token)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps || {}) })
    .then(async r => { if (!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); })
    .catch(e => afficherErreur('Quiz : ' + e.message));

  $('q-ouvrir').onclick = () => questionCourante && api('/api/quiz/ouvrir', { question_id: questionCourante });
  $('q-fermer').onclick = () => api('/api/quiz/fermer');
  $('q-reveler').onclick = () => questionCourante && api('/api/quiz/reveler', { question_id: questionCourante });
  $('q-reinit').onclick = () => {
    if (questionCourante && confirm(`Effacer toutes les réponses de ${questionCourante} ?`)) api('/api/quiz/reinitialiser', { question_id: questionCourante });
  };

  let finChrono = null;
  function rendreQuiz() {
    const ici = etatQuiz.question && etatQuiz.question.id === questionCourante;
    const ouverteIci = etatQuiz.ouverte && ici;
    const autreOuverte = etatQuiz.ouverte && etatQuiz.question && !ici;
    const q = ici ? etatQuiz.question : null;
    $('quiz-id').textContent = `quiz ${questionCourante}${q ? ' · ' + q.type + (q.chrono ? ' · ' + q.chrono + ' s' : '') : ''}`;
    $('quiz-etat').textContent = ouverteIci ? 'OUVERTE' : autreOuverte ? `${etatQuiz.question.id} ouverte ailleurs` : ici && etatQuiz.revele ? 'révélée' : 'fermée';
    $('quiz-etat').style.color = ouverteIci ? 'var(--vert)' : autreOuverte ? 'var(--orange)' : ici && etatQuiz.revele ? 'var(--bleu)' : 'var(--sourd)';
    $('q-ouvrir').disabled = ouverteIci;
    $('q-fermer').disabled = !etatQuiz.ouverte;
    $('q-reveler').disabled = !ici || !q.notee || etatQuiz.revele;
    const total = ici ? (etatQuiz.resultat ? etatQuiz.resultat.total : 0) : '–';
    finChrono = ouverteIci && etatQuiz.reste !== null && etatQuiz.reste !== undefined ? Date.now() + etatQuiz.reste * 1000 : null;
    $('q-compteur').innerHTML = `${total}${finChrono ? '<small id="q-reste"></small>' : ''}`;
  }
  setInterval(() => {
    const el = $('q-reste'); if (!el || finChrono === null) return;
    el.textContent = Math.max(0, Math.ceil((finChrono - Date.now()) / 1000)) + ' s';
  }, 250);


  // --- Questions des participants et séquence questions-réponses (docs/questions.md) ----
  let listeQ = [];                                   // GET /api/questions (avec pseudos), triée par ordre
  let etatQR = { actif: false, question_id: null, question: null, restantes: 0 };
  let modeQR = false;                                // le mode Q/R plein écran est affiché
  let triQ = 'ordre';                                // dernier tri appliqué : ordre (manuel), diapo, arrivee
  const apiGet = chemin => fetch(`${chemin}${chemin.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`, { cache: 'no-store' })
    .then(async r => { if (!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); });
  const apiDelete = chemin => fetch(`${chemin}?token=${encodeURIComponent(token)}`, { method: 'DELETE' })
    .then(async r => { if (!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); });
  const enAttente = () => listeQ.filter(q => q.etat === 'en_attente');

  async function chargerQuestions() {
    try { listeQ = await apiGet('/api/questions'); } catch (e) { afficherErreur('Questions : ' + e.message); return; }
    rendreBadgeQ();
    if (modeQR) rendreQR();
  }
  async function chargerQR() {
    try { appliquerQR(await apiGet('/api/qr')); } catch (e) { /* serveur injoignable : état inchangé */ }
  }
  function appliquerQR(m) {
    etatQR = { actif: !!m.actif, question_id: m.question ? m.question.id : null, question: m.question || null, restantes: Number(m.restantes) || 0 };
    // Télécommande rechargée pendant une séquence : le mode Q/R se rouvre à l'état courant.
    if (etatQR.actif && !modeQR) ouvrirModeQR();
    rendreBadgeQ();
    if (modeQR) rendreQR();
  }
  function rendreBadgeQ() {
    const n = enAttente().length;
    for (const id of ['badge-q', 'qr-badge']) { $(id).textContent = `? ${n}`; $(id).classList.toggle('actif', n > 0); }
    $('b-qr-nb').textContent = n; $('b-qr-nb').classList.toggle('visible', n > 0);
    $('b-qr').classList.toggle('en-cours', etatQR.actif);
  }
  function ouvrirModeQR() { modeQR = true; $('qr').classList.add('visible'); chargerQuestions(); rendreQR(); }
  function fermerModeQR() { modeQR = false; $('qr').classList.remove('visible'); }
  $('b-qr').onclick = ouvrirModeQR;
  $('qr-reduire').onclick = fermerModeQR;
  $('qr-terminer').onclick = async () => {
    if (!confirm('Terminer la séquence questions-réponses ? Le deck revient à la diapositive de départ.')) return;
    const r = await api('/api/qr/fermer'); if (r) { appliquerQR(r); fermerModeQR(); }
  };

  function titreCourt(t, n = 38) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t; }
  function el(tag, attrs, ...enfants) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) e[k] = v; else if (k === 'class') e.className = v; else if (k === 'disabled' || k === 'hidden') e[k] = !!v; else e.setAttribute(k, v);
    }
    enfants.flat().forEach(x => { if (x !== null && x !== undefined && x !== false) e.append(x instanceof Node ? x : document.createTextNode(String(x))); });
    return e;
  }

  function rendreQR() {
    const corps = $('qr-corps');
    corps.textContent = '';
    $('qr-terminer').hidden = !etatQR.actif;
    const attente = enAttente();
    if (etatQR.actif && etatQR.question) { corps.append(vueQuestion(etatQR.question)); return; }
    if (!etatQR.actif) {
      corps.append(el('div', { class: 'rappel' },
        el('div', { class: 'obs' }, el('div', {}, 'Arrête l\'enregistrement OBS avant de commencer (F9).',
          el('small', {}, 'Si le pont OBS (obs_quiz_bridge.py) tourne sur le PC 2, il arrête l\'enregistrement tout seul 2 s après « Commencer ». La séquence questions-réponses n\'est pas dans le replay.'))),
        el('button', { class: 'commencer', id: 'qr-commencer', onclick: async () => { const r = await api('/api/qr/ouvrir'); if (r) appliquerQR(r); } }, '▶ Commencer')));
    }
    if (!attente.length) {
      corps.append(el('div', { class: etatQR.actif ? 'fini-q' : 'vide-q' }, etatQR.actif ? 'Toutes les questions ont été traitées.' : 'Aucune question en attente pour l\'instant.'));
      if (etatQR.actif) corps.append(el('div', { class: 'vue-q' }, navDeck()));
      return;
    }
    corps.append(el('div', { class: 'tri' }, el('span', {}, 'Trier :'),
      el('button', { class: triQ === 'diapo' ? 'actif' : '', onclick: () => trier('diapo') }, 'par diapositive'),
      el('button', { class: triQ === 'arrivee' ? 'actif' : '', onclick: () => trier('arrivee') }, 'par arrivée')));
    const ul = el('ul', { class: 'liste-q' });
    attente.forEach((q, i) => {
      ul.append(el('li', { 'data-id': q.id },
        el('div', { class: 'corps', onclick: () => { if (etatQR.actif) traiter(q.id); else afficherErreur('Appuyer d\'abord sur « Commencer »'); } },
          el('div', { class: 'diapo' }, q.generale ? 'Générale' : `Diapo ${q.numero}`, el('small', {}, titreCourt(q.titre))),
          el('div', { class: 'texte' }, q.texte),
          el('div', { class: 'pseudo' }, '👤 ' + (q.pseudo || 'anonyme'))),
        el('div', { class: 'actions' },
          el('button', { title: 'Monter', disabled: i === 0, onclick: () => deplacer(i, -1) }, '▲'),
          el('button', { title: 'Descendre', disabled: i === attente.length - 1, onclick: () => deplacer(i, 1) }, '▼'),
          el('button', { class: 'ecarter', title: 'Écarter', onclick: () => ecarter(q) }, '✕'))));
    });
    corps.append(ul);
    if (etatQR.actif) corps.append(el('div', { class: 'vue-q' }, navDeck()));
  }
  function navDeck() {
    return el('div', { class: 'deck-nav' },
      el('button', { onclick: () => R && R.prev() }, '◀ Précédent'),
      el('button', { onclick: () => R && R.next() }, 'Suivant ▶'));
  }
  function vueQuestion(q) {
    const complete = listeQ.find(x => x.id === q.id) || q;
    const reste = etatQR.restantes;
    return el('div', { class: 'vue-q' },
      el('div', { class: 'diapo' }, q.generale ? 'Question générale' : `Diapositive ${q.numero}`, ' ', el('small', {}, `· ${titreCourt(q.titre, 60)} · ${reste} restante${reste > 1 ? 's' : ''}`)),
      el('div', { class: 'texte' }, q.texte),
      el('div', { class: 'pseudo' }, '👤 ' + (complete.pseudo || 'anonyme')),
      navDeck(),
      el('div', { class: 'actions-q' },
        el('button', { onclick: async () => { const r = await api('/api/qr/liste'); if (r) appliquerQR(r); } }, '✕ Liste'),
        el('button', { class: 'suivante', onclick: async () => { const r = await api('/api/qr/suivante'); if (r) appliquerQR(r); } }, '→ Suivante')));
  }
  async function traiter(id) { const r = await api('/api/qr/question', { id }); if (r) appliquerQR(r); }
  async function ecarter(q) {
    if (!confirm(`Écarter cette question ?\n« ${q.texte.slice(0, 80)} »`)) return;
    await api(`/api/questions/${q.id}/etat`, { etat: 'ecartee' });
    chargerQuestions();
  }
  async function envoyerOrdre(ids) { await api('/api/questions/ordre', { ids }); await chargerQuestions(); }
  function trier(mode) {
    triQ = mode;
    const ids = enAttente().sort((a, b) => mode === 'diapo' ? (a.h - b.h) || (a.id - b.id) : a.id - b.id).map(q => q.id);
    envoyerOrdre(ids);
  }
  function deplacer(i, sens) {
    triQ = 'ordre';
    const ids = enAttente().map(q => q.id);
    const j = i + sens; if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    envoyerOrdre(ids);
  }
  chargerQuestions(); chargerQR();

  let delaiQ = 1000;
  function connecterQuiz() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/quiz');
    ws.onopen = () => { delaiQ = 1000; chargerQuestions(); chargerQR(); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'quiz') { etatQuiz = m; rendreQuiz(); }
      else if (m.type === 'questions') chargerQuestions();
      else if (m.type === 'qr') { appliquerQR(m); chargerQuestions(); }
      else if (m.type === 'fin') afficherFin(m.terminee !== false);
    };
    ws.onclose = () => { setTimeout(connecterQuiz, delaiQ); delaiQ = Math.min(delaiQ * 2, 10000); };
    ws.onerror = () => ws.close();
  }
  connecterQuiz();
  // Si la question courante n'est pas celle du serveur, son compteur vient de l'état ciblé.
  setInterval(() => {
    if (questionCourante && !(etatQuiz.question && etatQuiz.question.id === questionCourante)) {
      fetch(`/api/quiz/etat?question_id=${encodeURIComponent(questionCourante)}`, { cache: 'no-store' })
        .then(r => r.json()).then(m => { if (!etatQuiz.ouverte) { etatQuiz = m; rendreQuiz(); } }).catch(() => {});
    }
  }, 3000);

  // --- Voyants : vert si accusé de réception reçu depuis moins de 5 s ----
  const acks = { scene: 0, obs: 0 };
  function voyant(id, age) {
    const el = $(id);
    el.classList.toggle('ok', age < 5000);
    el.classList.toggle('vieux', age >= 5000 && age < 30000);
  }
  setInterval(() => {
    voyant('v-scene', Date.now() - acks.scene);
    voyant('v-obs', Date.now() - acks.obs);
    const w = deck.contentWindow;
    voyant('v-serveur', w && w.AmphiSync && w.AmphiSync.connecte ? 0 : Infinity);
    // Relance d'un état toutes les 10 s pour provoquer un ack et détecter un décrochage silencieux.
    if (w && w.AmphiSync && Date.now() % 10000 < 1000) w.AmphiSync.publier(true);
  }, 1000);

  // --- Chronomètre démarré à la première diapositive ----
  let chronoDebut = null;
  function demarrerChrono() {
    chronoDebut = Date.now();
    setInterval(() => {
      if (seanceTerminee) return; // chronomètre figé pendant l'écran de fin
      const s = Math.floor((Date.now() - chronoDebut) / 1000);
      $('chrono').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 1000);
  }

  // --- Écran maintenu allumé ----
  async function wakeLock() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* refusé : ignorer */ }
  }
  wakeLock();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wakeLock(); });

  function afficherErreur(texte) {
    const el = $('erreur'); el.textContent = texte; el.classList.add('visible');
    clearTimeout(afficherErreur.t); afficherErreur.t = setTimeout(() => el.classList.remove('visible'), 5000);
  }
})();
</script>
</body>
</html>
