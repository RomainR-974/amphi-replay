# Site Nginx pour amphi-replay, utilisé quand Nginx occupe déjà les ports 80/443 (autres sites sur le serveur).
# Installé par deploy/install.sh dans /etc/nginx/sites-available/amphi-replay ; certbot ajoute le bloc HTTPS.
# __DOMAINE__ est remplacé par le sous-domaine choisi.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__;

    # Données personnelles : pas de journal d'accès (pas d'adresse IP conservée).
    access_log off;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # WebSockets (/ws/deck, /ws/quiz) : maintenus ouverts pendant toute la séance.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
